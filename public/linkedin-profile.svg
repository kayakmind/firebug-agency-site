      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1A1A2E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>

  <!-- Circular background -->
  <circle cx="200" cy="200" r="200" fill="#1A1A2E"/>
  <circle cx="200" cy="200" r="200" fill="url(#bgGlow)"/>

  <!-- Subtle ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Match icon - centered and scaled -->
